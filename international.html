<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>International Holiday Packages | White Swan Holidays Ahmedabad</title>
  <meta name="description" content="International holiday packages from Ahmedabad (AMD): Dubai & Abu Dhabi, Thailand, Japan Cherry Blossom, Canadian Rockies, and Bali.">
  <link rel="icon" href="img/white_swan_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/wsh-sunlit.css">
</head>
<body>

<div id="wsh-header-mount"></div>

<main>
  <!-- Page Header -->
  <section style="padding:3rem 0 2.2rem;background:linear-gradient(180deg, var(--tint-mint) 0%, var(--bg-ivory) 100%)">
    <div class="wsh-wrap">
      <span class="wsh-badge badge-sky" style="margin-bottom:0.75rem">INTERNATIONAL HOLIDAYS &bull; AMD CONNECTIVITY</span>
      <h1>Global Journeys Without Borders</h1>
      <p style="max-width:680px;font-size:1.02rem">
        Seamless flights from Sardar Vallabhbhai Patel International Airport (AMD), complete visa filing, and handpicked global hotels.
      </p>
    </div>
  </section>

  <!-- Filter Bar & Packages Grid -->
  <section style="padding:1rem 0 4rem">
    <div class="wsh-wrap">
      <div class="wsh-filter-bar">
        <div>
          <label for="intSearch" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Country / Region / Ref ID</label>
          <input type="text" id="intSearch" placeholder="Search Dubai, Japan, Bali, WSH-INT...">
        </div>

        <div>
          <label for="intVisa" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Visa Type</label>
          <select id="intVisa">
            <option value="all">All Visa Types</option>
            <option value="Visa-Free">Visa-Free / VOA</option>
            <option value="E-Visa">E-Visa</option>
            <option value="Sticker Visa">Sticker Visa</option>
          </select>
        </div>

        <div>
          <label for="intDuration" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Duration</label>
          <select id="intDuration">
            <option value="all">Any Duration</option>
            <option value="short">4–5 Nights</option>
            <option value="long">6+ Nights</option>
          </select>
        </div>

        <div>
          <label for="intBudget" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Max Budget (₹)</label>
          <select id="intBudget">
            <option value="all">All Budgets</option>
            <option value="50000">Up to ₹50,000</option>
            <option value="150000">Up to ₹1,50,000</option>
            <option value="250000">Up to ₹2,50,000</option>
          </select>
        </div>

        <button type="button" id="intResetBtn" class="btn btn-outline btn-sm" style="height:46px">Reset</button>
      </div>

      <div id="intCountBar" style="margin-bottom:1.25rem;font-size:0.88rem;font-weight:600;color:var(--ink-muted)"></div>

      <div class="wsh-pkg-grid" id="internationalGrid"></div>
    </div>
  </section>
</main>

<div id="wsh-footer-mount"></div>

<script src="js/wsh-store.js"></script>
<script src="js/wsh-shell.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('internationalGrid');
    const countBar = document.getElementById('intCountBar');
    const searchEl = document.getElementById('intSearch');
    const visaEl = document.getElementById('intVisa');
    const durationEl = document.getElementById('intDuration');
    const budgetEl = document.getElementById('intBudget');

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) searchEl.value = params.get('q');

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const visa = visaEl.value.toLowerCase();
      const dur = durationEl.value;
      const maxBudget = budgetEl.value === 'all' ? Infinity : Number(budgetEl.value);

      const pkgs = window.WSHStore.getPackages({ onlyActive: true, category: 'International' }).filter(p => {
        const textMatch = !q || `${p.title} ${p.destination} ${p.refCode} ${p.region}`.toLowerCase().includes(q);
        const visaMatch = visa === 'all' || (p.visaType || '').toLowerCase().includes(visa);
        const durMatch = dur === 'all' || (dur === 'short' ? (p.nights || 5) <= 5 : (p.nights || 5) >= 6);
        const budgetMatch = Number(p.price) <= maxBudget;
        return textMatch && visaMatch && durMatch && budgetMatch;
      });

      countBar.textContent = `Showing ${pkgs.length} International Package${pkgs.length === 1 ? '' : 's'}`;
      if (!pkgs.length) {
        grid.innerHTML = `<div class="wsh-card" style="grid-column:1/-1;padding:2.5rem;text-align:center"><h3>No matching international packages</h3><p>Try clearing filters or ask our AMD desk for a custom global quote.</p><a href="inquiry.html?type=International" class="btn btn-sky">Request Custom International Quote</a></div>`;
        return;
      }
      grid.innerHTML = pkgs.map(window.WSHShell.renderPackageCard).join('');
    }

    [searchEl, visaEl, durationEl, budgetEl].forEach(el => el.addEventListener('input', render));
    document.getElementById('intResetBtn').addEventListener('click', () => {
      searchEl.value = '';
      visaEl.value = 'all';
      durationEl.value = 'all';
      budgetEl.value = 'all';
      render();
    });

    render();
  });
</script>
</body>
</html>
