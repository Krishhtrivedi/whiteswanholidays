<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Domestic India Tour Packages | White Swan Holidays Ahmedabad</title>
  <meta name="description" content="Explore curated Domestic India tour packages from Ahmedabad: Kashmir, Kerala Backwaters, Sikkim Himalayas, and Vibrant Gujarat.">
  <link rel="icon" href="img/white_swan_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wsh_theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/wsh-sunlit.css">
</head>
<body>

<div id="wsh-header-mount"></div>

<main>
  <!-- Page Header -->
  <section style="padding:3rem 0 2.2rem;background:linear-gradient(180deg, var(--tint-peach) 0%, var(--bg-ivory) 100%)">
    <div class="wsh-wrap">
      <span class="wsh-badge badge-amber" style="margin-bottom:0.75rem">DOMESTIC INDIA CIRCUITS</span>
      <h1>Discover Incredible India</h1>
      <p style="max-width:660px;font-size:1.02rem">
        Handcrafted Indian holidays departing from Ahmedabad — private vehicles, verified 4-Star &amp; 5-Star stays, and 24&times;7 local support.
      </p>
    </div>
  </section>

  <!-- Filter Bar & Packages Grid -->
  <section style="padding:1rem 0 4rem">
    <div class="wsh-wrap">
      <div class="wsh-filter-bar" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 190px), 1fr))">
        <div>
          <label for="domSearch" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Destination / Ref Code</label>
          <input type="text" id="domSearch" placeholder="Search Kashmir, Kerala, WSH-DOM...">
        </div>

        <div>
          <label for="domDuration" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Duration</label>
          <select id="domDuration">
            <option value="all">Any Duration</option>
            <option value="short">Up to 4 Nights</option>
            <option value="medium">5+ Nights</option>
          </select>
        </div>

        <div>
          <label for="domStyle" style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-muted);margin-bottom:0.3rem">Travel Style</label>
          <select id="domStyle">
            <option value="all">All Styles</option>
            <option value="Family">Family</option>
            <option value="Honeymoon">Honeymoon</option>
            <option value="Spiritual">Spiritual</option>
            <option value="Adventure">Adventure</option>
          </select>
        </div>

        <button type="button" id="domResetBtn" class="btn btn-outline btn-sm" style="height:46px">Reset</button>
      </div>

      <div id="domCountBar" style="margin-bottom:1.25rem;font-size:0.88rem;font-weight:600;color:var(--ink-muted)"></div>

      <div class="wsh-pkg-grid" id="domesticGrid"></div>
    </div>
  </section>
</main>

<div id="wsh-footer-mount"></div>

<script src="js/wsh-store.js"></script>
<script src="js/wsh-shell.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('domesticGrid');
    const countBar = document.getElementById('domCountBar');
    const searchEl = document.getElementById('domSearch');
    const durationEl = document.getElementById('domDuration');
    const styleEl = document.getElementById('domStyle');

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) searchEl.value = params.get('q');

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const dur = durationEl.value;
      const style = styleEl.value.toLowerCase();

      const pkgs = window.WSHStore.getPackages({ onlyActive: true, category: 'Domestic' }).filter(p => {
        const textMatch = !q || `${p.title} ${p.destination} ${p.refCode} ${p.region}`.toLowerCase().includes(q);
        const durMatch = dur === 'all' || (dur === 'short' ? (p.nights || 5) <= 4 : (p.nights || 5) >= 5);
        const styleMatch = style === 'all' || (p.style || '').toLowerCase().includes(style);
        return textMatch && durMatch && styleMatch;
      });

      countBar.textContent = `Showing ${pkgs.length} Domestic India Package${pkgs.length === 1 ? '' : 's'}`;
      if (!pkgs.length) {
        grid.innerHTML = `<div class="wsh-card" style="grid-column:1/-1;padding:2.5rem;text-align:center"><h3>No matching domestic tours</h3><p>Try resetting filters or design your own custom itinerary.</p><a href="customize.html" class="btn btn-marigold">Design Custom India Tour</a></div>`;
        return;
      }
      grid.innerHTML = pkgs.map(window.WSHShell.renderPackageCard).join('');
    }

    [searchEl, durationEl, styleEl].forEach(el => el.addEventListener('input', render));
    document.getElementById('domResetBtn').addEventListener('click', () => {
      searchEl.value = '';
      durationEl.value = 'all';
      styleEl.value = 'all';
      render();
    });

    render();
  });
</script>
</body>
</html>
